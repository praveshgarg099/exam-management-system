name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with installer'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Exam Management System (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            Write-Host "Inno Setup found at $innoPath"
            echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            throw "Inno Setup installation directory not found!"
          }

      - name: Build Application JAR
        shell: cmd
        run: |
          call packaging\windows\scripts\build-app-jar.bat

      - name: Build Modular JRE Runtime (jlink)
        shell: cmd
        run: |
          call packaging\windows\scripts\build-runtime.bat target\runtime

      - name: Compile Windows Installer via Inno Setup
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\inno-setup\ExamManagementSystem.iss

      - name: Verify Installer Artifact
        shell: powershell
        run: |
          $installer = "dist\installer\ExamManagementSystem-Setup.exe"
          if (Test-Path $installer) {
            $item = Get-Item $installer
            Write-Host "SUCCESS: Installer generated!" -ForegroundColor Green
            Write-Host "File : $($item.FullName)"
            Write-Host "Size : $([Math]::Round($item.Length / 1MB, 2)) MB"
          } else {
            throw "ERROR: dist\installer\ExamManagementSystem-Setup.exe not found!"
          }

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamManagementSystem-Setup
          path: dist/installer/ExamManagementSystem-Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload Standalone JAR as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamManagementSystem-JAR
          path: dist/exam-management-system.jar
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release (Tag or Dispatch)
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          name: "Exam Management System ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/installer/ExamManagementSystem-Setup.exe
            dist/exam-management-system.jar
          draft: false
          prerelease: false
          body: |
            ## Exam Management System — Desktop Release

            ### Included Downloads:
            - **`ExamManagementSystem-Setup.exe`**: Standalone Windows installer with bundled modular JRE runtime and zero-touch database bootstrap.
            - **`exam-management-system.jar`**: Cross-platform application JAR for macOS and Linux.

            ### Default Credentials:
            - **Admin**: `superadmin` / `123456`
            - **Student**: `aaravs` / `Password@123`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
